server:
  port: 8082

spring:
  application:
    name: order-service

  kafka:
    bootstrap-servers: 192.168.177.99:9092

    consumer:
      group-id: order-compensation-group
      auto-offset-reset: earliest
      enable-auto-commit: true

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      properties:
        spring.json.trusted.packages: com.company.orderservice.event
        spring.json.value.default.type: com.company.orderservice.event.OrderCompensationEvent

  cloud:
    compatibility-verifier:
      enabled: false

    openfeign:
      circuitbreaker:
        enabled: true

      client:
        config:
          user-service:
            connectTimeout: 3000
            readTimeout: 5000

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:

      UserClientgetUserByIdLong:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        slidingWindowSize: 5
        slidingWindowType: COUNT_BASED
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2